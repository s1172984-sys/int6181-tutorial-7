name: Run Tests

on: 
   pull_request:
      branches:
         - '*'
      workflow_dispatch:

jobs:
   test:
     runs-on: ubuntu-latest
     permissions: 
        contents: read

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/set up-python@v4
        with:
           python-version:'3.x'
      - name: Run tests
        run: python test_password_validator.py
